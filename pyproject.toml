[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hermes-theme-editor"
version = "0.1.0"
description = "Visual theme editor plugin for the Hermes Agent dashboard"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sanchomuzax" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[project.entry-points."hermes_agent.plugins"]
hermes-theme-editor = "hermes_theme_editor:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-omit=tests/*,venv/*,.venv/*"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*", "setup.py"]
