name: anthropic
label: "Claude — Anthropic"
description: "Anthropic's signature palette — warm dark backgrounds, terracotta accent, clean Inter typography. Inspired by claude.ai."

palette:
  background:
    hex: "#1a1410"
    alpha: 1.0
  midground: "#e8e2d8"
  foreground:
    hex: "#d97757"
    alpha: 0.05
  warmGlow: "rgba(217, 119, 87, 0.16)"
  noiseOpacity: 0.55

typography:
  fontSans: '"Inter", system-ui, -apple-system, sans-serif'
  fontMono: '"JetBrains Mono", "Fira Code", ui-monospace, monospace'
  fontDisplay: '"Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.65"
  letterSpacing: "0"

layout:
  radius: "0.625rem"
  density: "comfortable"

layoutVariant: "standard"

colorOverrides:
  primary: "#d97757"
  primaryForeground: "#ffffff"
  accent: "#e8a07a"
  accentForeground: "#1a1410"
  secondary: "#2a2218"
  secondaryForeground: "#e8e2d8"
  muted: "#251e18"
  mutedForeground: "#9b8f84"
  card: "#211a14"
  cardForeground: "#e8e2d8"
  destructive: "#c0504a"
  destructiveForeground: "#ffffff"
  success: "#4e9e72"
  warning: "#c8892a"
  border: "rgba(232, 226, 216, 0.10)"
  input: "rgba(232, 226, 216, 0.12)"
  ring: "#d97757"
  popover: "#211a14"
  popoverForeground: "#e8e2d8"

componentStyles:
  header:
    background: "rgba(20, 16, 11, 0.97)"
  sidebar:
    background: "rgba(16, 12, 8, 0.98)"
  card:
    background: "rgba(255, 248, 240, 0.025)"
    boxShadow: "0 1px 3px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(232, 226, 216, 0.06)"

assets:
  bg: ""

customCSS: |
  /* Subtle terracotta glow on active/focused primary elements */
  :root[data-theme="anthropic"] *:focus-visible {
    outline: 2px solid rgba(217, 119, 87, 0.7);
    outline-offset: 2px;
  }
  /* Warmer scrollbar */
  :root[data-theme="anthropic"] ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  :root[data-theme="anthropic"] ::-webkit-scrollbar-track {
    background: transparent;
  }
  :root[data-theme="anthropic"] ::-webkit-scrollbar-thumb {
    background: rgba(217, 119, 87, 0.25);
    border-radius: 3px;
  }
  :root[data-theme="anthropic"] ::-webkit-scrollbar-thumb:hover {
    background: rgba(217, 119, 87, 0.45);
  }
